<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAB HANOI BADMINTON CHAMPIONSHIP 2026</title>
  
  <!-- Favicon ngôi sao đỏ NAB 7 cánh -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32.0,2.0 37.6,20.3 55.5,13.3 44.7,29.1 61.2,38.7 42.2,40.1 45.0,59.0 32.0,45.0 19.0,59.0 21.8,40.1 2.8,38.7 19.3,29.1 8.5,13.3 26.4,20.3' fill='%23C70000'/%3E%3C/svg%3E">

  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- SheetJS & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* THEME VARIABLES */
    :root {
      --nab-red: #C70000;
      --nab-red-dark: #9E0000;
      --nab-red-light: #FDE8E8;
      
      /* Light Theme */
      --bg-primary: #F4F5F7;
      --bg-card: #FFFFFF;
      --bg-card-inner: #F8FAFC;
      --border-color: #E5E7EB;
      --border-subtle: #F1F5F9;
      --text-primary: #1A1A1A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --header-bg: #FFFFFF;
      --input-bg: #FFFFFF;
      --tab-nav-bg: #F1F5F9;
      --tab-btn-active-bg: #FFFFFF;
      --table-header-bg: #F8FAFC;
      --table-row-bg: #FFFFFF;
      --table-row-hover: #FEF2F2;
      --table-border: #E5E7EB;
      --progress-track: #E2E8F0;
      --detail-panel-bg: #F8FAFC;
      --radar-box-bg: #FFFFFF;
      --radar-grid: #CBD5E1;
      --radar-label: #334155;
      --note-bg: #FEF9C3;
      --note-border: #EAB308;
      --note-text: #713F12;
      --hero-bg: linear-gradient(135deg, #1A1A1A 0%, #2A2A2A 100%);
      --btn-tool-bg: #F1F5F9;
      --btn-tool-border: #CBD5E1;
      --btn-tool-text: #334155;
      --non-nab-bg: #F1F5F9;
      --non-nab-text: #475569;
      --non-nab-border: #CBD5E1;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);

      /* Match Board Specific */
      --court-badge-bg: #EFF6FF;
      --court-badge-text: #1D4ED8;
      --match-card-bg: #FFFFFF;
      --match-card-border: #E2E8F0;
    }

    body.dark-mode {
      /* Dark Theme */
      --bg-primary: #07090E;
      --bg-card: #11151F;
      --bg-card-inner: #161C28;
      --border-color: #232B3C;
      --border-subtle: #19202F;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --header-bg: #0D1017;
      --input-bg: #151922;
      --tab-nav-bg: #161C28;
      --tab-btn-active-bg: #11151F;
      --table-header-bg: #161C28;
      --table-row-bg: #10141D;
      --table-row-hover: #1A2234;
      --table-border: #232B3C;
      --progress-track: #1C2433;
      --detail-panel-bg: #0C0F17;
      --radar-box-bg: #11151F;
      --radar-grid: #334155;
      --radar-label: #94A3B8;
      --note-bg: #272008;
      --note-border: #CA8A04;
      --note-text: #FEF08A;
      --hero-bg: linear-gradient(135deg, #11151F 0%, #1A2130 100%);
      --btn-tool-bg: #1E2536;
      --btn-tool-border: #2D374D;
      --btn-tool-text: #FFFFFF;
      --non-nab-bg: #1E2536;
      --non-nab-text: #94A3B8;
      --non-nab-border: #334155;
      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.45);

      /* Match Board Specific */
      --court-badge-bg: #172554;
      --court-badge-text: #93C5FD;
      --match-card-bg: #121722;
      --match-card-border: #232B3C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      padding-bottom: 60px;
    }

    header {
      background: var(--header-bg);
      border-bottom: 3px solid var(--nab-red);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nab-star {
      background: var(--nab-red);
      color: white;
      font-weight: 800;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .nav-tabs {
      display: flex;
      background: var(--tab-nav-bg);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .nav-tab-btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .nav-tab-btn:hover {
      color: var(--text-primary);
    }

    .nav-tab-btn.active {
      background: var(--tab-btn-active-bg);
      color: var(--nab-red);
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    body.dark-mode .nav-tab-btn.active {
      color: #FF4D4D;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-header {
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-sync {
      background: var(--nab-red);
      color: #fff;
    }

    .btn-sync:hover {
      background: var(--nab-red-dark);
    }

    .btn-doc {
      background: var(--bg-card);
      color: #1E40AF;
      border-color: #BFDBFE;
    }

    body.dark-mode .btn-doc {
      color: #93C5FD;
      border-color: #1E3A8A;
    }

    .btn-theme {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .btn-theme:hover {
      border-color: var(--nab-red);
      color: var(--nab-red);
    }

    .container {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .tab-view {
      display: none;
    }

    .tab-view.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    /* ========================================================= */
    /* UI STYLES TAB: THỨ TỰ THI ĐẤU & BẢNG ĐIỂM TRỰC TIẾP       */
    /* ========================================================= */
    .matches-live-header {
      margin-bottom: 24px;
    }

    .matches-live-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .matches-live-title span.title-red {
      color: var(--nab-red);
    }

    .matches-live-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Timeline Cards */
    .timeline-cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 28px;
    }

    .timeline-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .timeline-card-time {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--nab-red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    body.dark-mode .timeline-card-time {
      color: #F87171;
    }

    .timeline-card-desc {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    /* Section Title Dark UI */
    .board-section-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .board-section-title span.bar-red {
      color: var(--nab-red);
    }

    /* Standings Table NAB Red */
    .team-points-table-wrap {
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin-bottom: 34px;
      box-shadow: var(--shadow-sm);
    }

    .team-points-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: center;
    }

    .team-points-table th {
      background: #C70000;
      color: #FFFFFF;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
    }

    .team-points-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--table-border);
      background: var(--table-row-bg);
      color: var(--text-primary);
    }

    .team-points-table tr:hover td {
      background: var(--table-row-hover);
    }

    .team-points-table td:nth-child(2) {
      text-align: left;
      font-weight: 700;
      padding-left: 18px;
    }

    .team-points-table .score-total {
      font-weight: 900;
      font-size: 14.5px;
      color: var(--nab-red);
    }

    body.dark-mode .team-points-table .score-total {
      color: #F87171;
    }

    /* 9 Events Grid */
    .events-grid-9 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 34px;
    }

    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }

    .event-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .event-card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .event-tier-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--court-badge-bg);
      color: var(--court-badge-text);
      white-space: nowrap;
    }

    .event-pairs-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
      font-size: 12px;
    }

    .event-pair-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      background: var(--bg-card-inner);
      padding: 5px 8px;
      border-radius: 4px;
    }

    .event-pair-badge {
      font-weight: 800;
      font-size: 10.5px;
      color: #fff;
      background: #475569;
      padding: 1px 6px;
      border-radius: 3px;
      letter-spacing: 0.3px;
    }

    .event-pair-badge.t1 { background: #C70000; }
    .event-pair-badge.t2 { background: #2563EB; }
    .event-pair-badge.t3 { background: #059669; }
    .event-pair-badge.t4 { background: #D97706; }

    .event-pair-names {
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-standing-mini {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      text-align: center;
      margin-top: auto;
    }

    .event-standing-mini th {
      background: #C70000;
      color: #fff;
      padding: 4px 6px;
      font-weight: 700;
    }

    .event-standing-mini td {
      padding: 5px 6px;
      border-bottom: 1px solid var(--table-border);
      color: var(--text-primary);
    }

    /* 72 Matches Filtering and Layout */
    .matches-filter-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .match-pills-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card-inner);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .pill-btn:hover {
      border-color: var(--nab-red);
      color: var(--text-primary);
    }

    .pill-btn.active {
      background: var(--nab-red);
      border-color: var(--nab-red);
      color: #FFFFFF;
      font-weight: 700;
    }

    .matches-select-filter {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
    }

    /* Matches Section Accordions / Cards */
    .round-group {
      margin-bottom: 24px;
      transition: margin-bottom 0.2s ease;
    }

    .round-group.collapsed {
      margin-bottom: 12px;
    }

    .round-group-header {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--nab-red);
      border-radius: 6px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .round-group-header:hover {
      background: var(--table-row-hover);
    }

    .round-badge-count {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 6px;
    }

    .round-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .round-state-text {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .round-toggle-icon {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.25s ease;
    }

    .round-group.collapsed .matches-grid {
      display: none;
    }

    .round-group.collapsed .round-group-header {
      margin-bottom: 0;
    }

    .round-group.collapsed .round-toggle-icon {
      transform: rotate(-90deg);
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .match-item-card {
      background: var(--match-card-bg);
      border: 1px solid var(--match-card-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .match-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
    }

    .match-court-tag {
      font-weight: 800;
      background: var(--court-badge-bg);
      color: var(--court-badge-text);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .match-event-name {
      font-weight: 700;
      color: var(--text-muted);
      font-size: 11.5px;
    }

    .match-teams-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 4px 0;
    }

    .match-team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }

    .match-team-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match-score-pill {
      font-weight: 800;
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      min-width: 32px;
      text-align: center;
    }

    .match-score-pill.winner {
      background: #C70000;
      color: #fff;
      border-color: #C70000;
    }

    .match-sets-detail {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card-inner);
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px dashed var(--border-color);
      text-align: center;
      margin-top: 2px;
    }

    .btn-quick-score {
      background: var(--btn-tool-bg);
      border: 1px solid var(--btn-tool-border);
      color: var(--btn-tool-text);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 4px;
    }

    .btn-quick-score:hover {
      border-color: var(--nab-red);
      color: var(--nab-red);
    }

    /* Modal Score Entry */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 22px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-md);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }

    .modal-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .modal-inputs-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      text-align: center;
    }

    .score-input-number {
      width: 100%;
      padding: 8px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text-primary);
      outline: none;
    }

    .score-input-number:focus {
      border-color: var(--nab-red);
    }

    .modal-set-row {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .modal-set-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-align: left;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* ========================================================= */
    /* STYLES TAB: QUY CHẾ & THỂ THỨC GIẢI                       */
    /* ========================================================= */
    .rules-header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--nab-red);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .rules-badge-official {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--nab-red-light);
      color: var(--nab-red);
